name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild MyFanControl.sln /m /p:Configuration=Release /p:Platform=Win32

      - uses: actions/upload-artifact@v7
        with:
          name: MyFanControl-${{ github.sha }}
          path: Release/MyFanControl.exe

      # 推送 v* 标签时发布 Release，只包含本仓库编译的 exe；
      # ClevoEcInfo.dll、NVGPU_DLL.dll 和 NTPort 安装包请从原作者的 Release 获取
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Release/MyFanControl.exe --title "${{ github.ref_name }}" --generate-notes

  # 新版 ClevoFan（.NET 服务 + 托盘）：运行单元测试并打包
  clevofan:
    runs-on: windows-2022
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test src/ClevoFan.slnx -c Release

      - name: Publish
        run: |
          dotnet publish src/ClevoFan.Service -c Release -o publish/ClevoFan
          dotnet publish src/ClevoFan.Tray -c Release -o publish/ClevoFan
          Copy-Item deploy/install.ps1, deploy/uninstall.ps1 publish/ClevoFan/

      - uses: actions/upload-artifact@v7
        with:
          name: ClevoFan-${{ github.sha }}
          path: publish/ClevoFan

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive publish/ClevoFan/* ClevoFan.zip
          gh release upload "${{ github.ref_name }}" ClevoFan.zip
